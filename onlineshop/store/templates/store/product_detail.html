{% extends 'store/base.html' %}

{% block title %}{{ product.title }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if product.image %}
            <img src="{{ product.image.url }}" alt="{{ product.title }}" class="img-fluid">
        {% endif %}
    </div>
    <div class="col-md-6">
        <h2>{{ product.title }}</h2>
        <p>{{ product.description }}</p>
        <h4>Price: {{ product.price }}</h4>
        <a href="/" class="btn btn-secondary mt-3">Back to Products</a>
    </div>
</div>
{% endblock %}
